<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FieldFlow Support</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen" class="screen active">
    <div class="login-card">
      <div class="logo">
        <span class="logo-field">Field</span><span class="logo-flow">Flow</span>
      </div>
      <p class="login-subtitle">Support &amp; Onboarding</p>
      <div class="login-form">
        <label for="business-select">Select your business to get started</label>
        <select id="business-select">
          <option value="">— Choose your business —</option>
        </select>
        <button id="start-btn" class="btn-primary" disabled>Start Chat</button>
      </div>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="screen">
    <header class="chat-header">
      <div class="header-left">
        <div class="logo-sm">
          <span class="logo-field">Field</span><span class="logo-flow">Flow</span>
        </div>
        <span class="header-divider">|</span>
        <span class="header-label">Support</span>
      </div>
      <div class="header-right">
        <span id="business-badge" class="business-badge"></span>
        <button id="signout-btn" class="btn-ghost">Sign out</button>
      </div>
    </header>

    <div id="messages" class="messages-area"></div>

    <div class="input-area">
      <div id="suggestions" class="suggestions"></div>
      <div class="input-row">
        <input type="text" id="message-input" placeholder="Ask a question..." autocomplete="off">
        <button id="send-btn" class="btn-send" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 9H16M16 9L10 3M16 9L10 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
